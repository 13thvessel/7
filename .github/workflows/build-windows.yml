          cat > work/src/desktopMain/kotlin/com/lagradost/desktop/Main.kt <<'CS_EOF_6'
          package com.lagradost.desktop

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.DpSize
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.window.Window
          import androidx.compose.ui.window.application
          import androidx.compose.ui.window.rememberWindowState

          fun main() {
              Storage.load()
              val pluginErrors = PluginManager.loadAll()

              application {
                  val state = remember { AppState().also { s -> if (pluginErrors.isNotEmpty()) s.snackbar = pluginErrors.first() } }
                  Window(
                      onCloseRequest = ::exitApplication,
                      title = "CloudStream Desktop",
                      state = rememberWindowState(size = DpSize(1280.dp, 820.dp)),
                  ) {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(Modifier.fillMaxSize()) { App(state) }
                      }
                  }
              }
          }

          @Composable
          fun App(state: AppState) {
              val host = remember { SnackbarHostState() }
              LaunchedEffect(state.snackbar) {
                  state.snackbar?.let { host.showSnackbar(it); state.snackbar = null }
              }

              Scaffold(snackbarHost = { SnackbarHost(host) }) { pad ->
                  Row(Modifier.padding(pad).fillMaxSize()) {
                      if (state.current !is Screen.Play) {
                          NavigationRail {
                              Spacer(Modifier.height(8.dp))
                              @Composable
                              fun item(label: String, icon: String, target: Screen) = NavigationRailItem(
                                  selected = state.current == target,
                                  onClick = { state.root(target) },
                                  icon = { Text(icon) }, label = { Text(label) },
                              )
                              item("Home", "🏠", Screen.Home)
                              item("Cerca", "🔍", Screen.Search)
                              item("Preferiti", "★", Screen.Favorites)
                              item("Estensioni", "🧩", Screen.Plugins)
                          }
                      }
                      Box(Modifier.weight(1f).fillMaxHeight()) {
                          when (val s = state.current) {
                              Screen.Home -> HomeScreen(state)
                              Screen.Search -> SearchScreen(state)
                              Screen.Favorites -> FavoritesScreen(state)
                              Screen.Plugins -> PluginsScreen(state)
                              is Screen.Details -> DetailsScreen(state, s.url, s.apiName)
                              is Screen.Play -> PlayerScreen(s.title, s.link, s.subs) { state.pop() }
                          }
                      }
                  }
              }
          }
