          package com.lagradost.desktop

          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.LazyRow
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.KeyboardActions
          import androidx.compose.foundation.text.KeyboardOptions
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.text.input.ImeAction
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import com.lagradost.cloudstream3.*
          import com.lagradost.cloudstream3.utils.ExtractorLink
          import kotlinx.coroutines.*
          import java.awt.FileDialog
          import java.awt.Frame
          import java.awt.Desktop

          // ───────────────────────── componenti comuni ─────────────────────────

          @Composable
          fun PosterCard(
              name: String, posterUrl: String?, headers: Map<String, String>?, subtitle: String? = null,
              modifier: Modifier = Modifier, onClick: () -> Unit,
          ) {
              Column(modifier.width(150.dp).clip(RoundedCornerShape(10.dp)).clickable(onClick = onClick).padding(4.dp)) {
                  Poster(posterUrl, Modifier.fillMaxWidth().aspectRatio(2f / 3f).clip(RoundedCornerShape(8.dp)), headers)
                  Spacer(Modifier.height(6.dp))
                  Text(name, maxLines = 2, overflow = TextOverflow.Ellipsis, style = MaterialTheme.typography.bodyMedium)
                  subtitle?.let { Text(it, style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.onSurfaceVariant) }
              }
          }

          @Composable
          fun SearchResponse.toCard(onClick: () -> Unit) =
              PosterCard(name, posterUrl, posterHeaders, apiName, onClick = onClick)

          @Composable
          fun Centered(content: @Composable ColumnScope.() -> Unit) =
              Column(Modifier.fillMaxSize(), Arrangement.Center, Alignment.CenterHorizontally, content = content)

          @Composable
          fun NoProviders(state: AppState) = Centered {
              Text("Nessuna estensione installata", style = MaterialTheme.typography.titleLarge)
              Spacer(Modifier.height(8.dp))
              Text("Come nell'app originale, senza estensioni non ci sono fonti video.")
              Spacer(Modifier.height(16.dp))
              Button(onClick = { state.root(Screen.Plugins) }) { Text("Gestisci estensioni") }
          }

          // ───────────────────────── Home ─────────────────────────

          @Composable
          fun HomeScreen(state: AppState) {
              val providers = state.providers()
              if (providers.isEmpty()) return NoProviders(state)

              val api = providers.firstOrNull { it.name == state.selectedProvider } ?: providers.first()
              var rows by remember(api) { mutableStateOf<List<HomePageList>>(emptyList()) }
              var loading by remember(api) { mutableStateOf(true) }
              var error by remember(api) { mutableStateOf<String?>(null) }

              LaunchedEffect(api) {
                  loading = true; error = null; rows = emptyList()
                  if (!api.hasMainPage) { loading = false; return@LaunchedEffect }
                  // carica le sezioni in parallelo, mostrandole man mano
                  coroutineScope {
                      api.mainPage.map { page ->
                          async {
                              runCatching {
                                  api.getMainPage(1, MainPageRequest(page.name, page.data, page.horizontalImages))
                              }.onSuccess { r -> if (r != null) rows = rows + r.items }
                                  .onFailure { error = it.message ?: it.toString() }
                          }
                      }.awaitAll()
                  }
                  loading = false
              }

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      Text("Home", style = MaterialTheme.typography.headlineSmall)
                      var open by remember { mutableStateOf(false) }
                      Box {
                          OutlinedButton(onClick = { open = true }) { Text("${api.name} ▾") }
                          DropdownMenu(open, { open = false }) {
                              providers.forEach { p ->
                                  DropdownMenuItem(text = { Text(p.name) }, onClick = { state.selectedProvider = p.name; open = false })
                              }
                          }
                      }
                      if (loading) CircularProgressIndicator(Modifier.size(20.dp), strokeWidth = 2.dp)
                  }
                  error?.let { Text("Errore: $it", color = MaterialTheme.colorScheme.error) }
                  if (!api.hasMainPage) Text("Questa estensione non ha una home: usa la ricerca.")

                  LazyColumn(verticalArrangement = Arrangement.spacedBy(16.dp)) {
                      items(rows) { row ->
                          Text(row.name, style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(6.dp))
                          LazyRow(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              items(row.list) { r -> r.toCard { state.push(Screen.Details(r.url, r.apiName)) } }
                          }
                      }
                  }
              }
          }

          // ───────────────────────── Cerca ─────────────────────────

          @Composable
          fun SearchScreen(state: AppState) {
              val providers = state.providers()
              if (providers.isEmpty()) return NoProviders(state)

              var query by remember { mutableStateOf("") }
              var results by remember { mutableStateOf<List<SearchResponse>>(emptyList()) }
              var loading by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()
              var job by remember { mutableStateOf<Job?>(null) }

              fun doSearch() {
                  val q = query.trim()
                  if (q.isEmpty()) return
                  job?.cancel()
                  results = emptyList(); loading = true
                  job = scope.launch {
                      coroutineScope {
                          providers.map { api ->
                              async {
                                  runCatching { withTimeout(20_000) { api.search(q) } }.getOrNull()
                                      ?.let { r -> results = results + r }
                              }
                          }.awaitAll()
                      }
                      loading = false
                  }
              }

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                      OutlinedTextField(
                          value = query, onValueChange = { query = it }, singleLine = true,
                          label = { Text("Cerca film, serie, anime…") },
                          keyboardOptions = KeyboardOptions(imeAction = ImeAction.Search),
                          keyboardActions = KeyboardActions(onSearch = { doSearch() }),
                          modifier = Modifier.weight(1f),
                      )
                      Button(onClick = ::doSearch) { Text("Cerca") }
                      if (loading) CircularProgressIndicator(Modifier.size(20.dp), strokeWidth = 2.dp)
                  }
                  Spacer(Modifier.height(12.dp))
                  LazyVerticalGrid(GridCells.Adaptive(160.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(results) { r -> r.toCard { state.push(Screen.Details(r.url, r.apiName)) } }
                  }
              }
          }

          // ───────────────────────── Dettagli ─────────────────────────

          private data class EpisodeItem(val label: String, val data: String, val description: String?)

          private fun Episode.toItem(i: Int) = EpisodeItem(
              label = buildString {
                  if (season != null) append("S$season")
                  append("E${episode ?: (i + 1)}")
                  name?.let { append(" · $it") }
              },
              data = data, description = description,
          )

          @Composable
          fun DetailsScreen(state: AppState, url: String, apiName: String) {
              val api = remember(apiName) { APIHolder.getApiFromNameNull(apiName) }
              var load by remember(url) { mutableStateOf<LoadResponse?>(null) }
              var error by remember(url) { mutableStateOf<String?>(null) }
              var dub by remember(url) { mutableStateOf<DubStatus?>(null) }
              val scope = rememberCoroutineScope()

              var linksDialog by remember { mutableStateOf<Pair<List<ExtractorLink>, List<SubtitleFile>>?>(null) }
              var resolving by remember { mutableStateOf(false) }
              var playTitle by remember { mutableStateOf("") }

              LaunchedEffect(url) {
                  if (api == null) { error = "Estensione \"$apiName\" non caricata"; return@LaunchedEffect }
                  runCatching { api.load(url) }
                      .onSuccess { load = it; if (it == null) error = "Nessun risultato" }
                      .onFailure { error = it.message ?: it.toString() }
              }

              fun play(title: String, data: String) {
                  val a = api ?: return
                  resolving = true; playTitle = title
                  scope.launch {
                      val r = runCatching { fetchLinks(a, data) }.getOrNull()
                      resolving = false
                      if (r == null || r.first.isEmpty()) state.message("Nessun link trovato") else linksDialog = r
                  }
              }

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  TextButton(onClick = { state.pop() }) { Text("← Indietro") }
                  error?.let { Text(it, color = MaterialTheme.colorScheme.error) }
                  val d = load
                  if (d == null && error == null) CircularProgressIndicator()
                  if (d != null) {
                      Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                          Poster(d.posterUrl, Modifier.width(220.dp).aspectRatio(2f / 3f).clip(RoundedCornerShape(10.dp)), d.posterHeaders)
                          Column(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                              Text(d.name, style = MaterialTheme.typography.headlineMedium)
                              Text(
                                  listOfNotNull(d.year?.toString(), d.score?.toDouble(10)?.let { "★ %.1f".format(it) },
                                      d.duration?.let { "$it min" }, d.apiName).joinToString(" · "),
                                  color = MaterialTheme.colorScheme.onSurfaceVariant,
                              )
                              d.tags?.takeIf { it.isNotEmpty() }?.let { Text(it.joinToString(", "), style = MaterialTheme.typography.labelLarge) }
                              d.plot?.let { Text(it, maxLines = 8, overflow = TextOverflow.Ellipsis) }
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                                  if (d is MovieLoadResponse) Button(onClick = { play(d.name, d.dataUrl) }) { Text("▶ Riproduci") }
                                  if (d is LiveStreamLoadResponse) Button(onClick = { play(d.name, d.dataUrl) }) { Text("▶ Riproduci") }
                                  val fav = Storage.Fav(d.name, d.url, d.apiName, d.posterUrl)
                                  val isFav = Storage.isFavorite(d.url, d.apiName)
                                  OutlinedButton(onClick = { Storage.toggleFavorite(fav) }) { Text(if (isFav) "★ Nei preferiti" else "☆ Aggiungi ai preferiti") }
                                  if (resolving) CircularProgressIndicator(Modifier.size(20.dp), strokeWidth = 2.dp)
                              }
                          }
                      }
                      Spacer(Modifier.height(12.dp))

                      val episodes: List<EpisodeItem> = when (d) {
                          is TvSeriesLoadResponse -> d.episodes.mapIndexed { i, e -> e.toItem(i) }
                          is AnimeLoadResponse -> {
                              val keys = d.episodes.keys.toList()
                              val sel = dub?.takeIf { it in keys } ?: keys.firstOrNull()
                              if (keys.size > 1) Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  keys.forEach { k ->
                                      FilterChip(selected = k == sel, onClick = { dub = k }, label = { Text(k.name) })
                                  }
                              }
                              d.episodes[sel].orEmpty().mapIndexed { i, e -> e.toItem(i) }
                          }
                          else -> emptyList()
                      }
                      if (episodes.isNotEmpty()) {
                          Text("Episodi (${episodes.size})", style = MaterialTheme.typography.titleMedium)
                          LazyColumn(verticalArrangement = Arrangement.spacedBy(4.dp)) {
                              items(episodes) { ep ->
                                  ListItem(
                                      headlineContent = { Text(ep.label) },
                                      supportingContent = ep.description?.let { { Text(it, maxLines = 2, overflow = TextOverflow.Ellipsis) } },
                                      trailingContent = { TextButton(onClick = { play("${d.name} – ${ep.label}", ep.data) }) { Text("▶") } },
                                      modifier = Modifier.clickable { play("${d.name} – ${ep.label}", ep.data) },
                                  )
                              }
                          }
                      }
                  }
              }

              linksDialog?.let { (links, subs) ->
                  AlertDialog(
                      onDismissRequest = { linksDialog = null },
                      title = { Text("Scegli la sorgente") },
                      text = {
                          LazyColumn {
                              items(links) { l ->
                                  ListItem(
                                      headlineContent = { Text(l.name) },
                                      supportingContent = { Text(if (l.quality > 0) "${l.quality}p · ${l.type}" else l.type.toString()) },
                                      modifier = Modifier.clickable {
                                          linksDialog = null
                                          state.push(Screen.Play(playTitle, l, subs))
                                      },
                                  )
                              }
                          }
                      },
                      confirmButton = { TextButton(onClick = { linksDialog = null }) { Text("Annulla") } },
                  )
              }
          }

          // ───────────────────────── Preferiti ─────────────────────────

          @Composable
          fun FavoritesScreen(state: AppState) {
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Text("Preferiti", style = MaterialTheme.typography.headlineSmall)
                  Spacer(Modifier.height(8.dp))
                  if (Storage.favorites.isEmpty()) Text("Ancora nessun preferito.")
                  LazyVerticalGrid(GridCells.Adaptive(160.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                      items(Storage.favorites.toList()) { f ->
                          PosterCard(f.name, f.posterUrl, null, f.apiName) { state.push(Screen.Details(f.url, f.apiName)) }
                      }
                  }
              }
          }

          // ───────────────────────── Estensioni ─────────────────────────

          @Composable
          fun PluginsScreen(state: AppState) {
              var url by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              val scope = rememberCoroutineScope()

              fun report(r: Result<PluginManager.Loaded>) {
                  state.providersVersion++
                  state.message(r.fold({ "Caricata: ${it.name}" }, { "Errore: ${it.message ?: it}" }))
              }

              Column(Modifier.fillMaxSize().padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Text("Estensioni", style = MaterialTheme.typography.headlineSmall)
                  Text(
                      "Le estensioni Android (.cs3) non sono compatibili con Windows. Servono plugin .jar " +
                          "compilati per JVM contro la libreria di CloudStream (vedi README).",
                      color = MaterialTheme.colorScheme.onSurfaceVariant,
                  )
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp), verticalAlignment = Alignment.CenterVertically) {
                      OutlinedTextField(url, { url = it }, singleLine = true, label = { Text("URL di un plugin .jar") }, modifier = Modifier.weight(1f))
                      Button(enabled = url.isNotBlank() && !busy, onClick = {
                          busy = true
                          scope.launch { report(withContext(Dispatchers.IO) { PluginManager.installFromUrl(url.trim()) }); busy = false; url = "" }
                      }) { Text("Installa") }
                  }
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedButton(onClick = {
                          val dlg = FileDialog(null as Frame?, "Seleziona un plugin .jar", FileDialog.LOAD)
                          dlg.setFilenameFilter { _, n -> n.endsWith(".jar", true) }
                          dlg.isVisible = true
                          val f = dlg.file?.let { java.io.File(dlg.directory, it) }
                          if (f != null) report(PluginManager.installFromFile(f))
                      }) { Text("Da file…") }
                      OutlinedButton(onClick = { runCatching { Desktop.getDesktop().open(Storage.pluginsDir) } }) { Text("Apri cartella plugin") }
                  }
                  HorizontalDivider()
                  if (PluginManager.loaded.isEmpty()) Text("Nessun plugin caricato.")
                  LazyColumn {
                      items(PluginManager.loaded.toList()) { p ->
                          ListItem(
                              headlineContent = { Text(p.name) },
                              supportingContent = { Text(p.file.name + (p.version?.let { " · v$it" } ?: "")) },
                              trailingContent = {
                                  TextButton(onClick = { PluginManager.unload(p); state.providersVersion++ }) { Text("Rimuovi") }
                              },
                          )
                      }
                  }
              }
          }
          CS_EOF_9
          cat > work/src/desktopMain/kotlin/com/lagradost/desktop/Storage.kt <<'CS_EOF_10'
          package com.lagradost.desktop

          import androidx.compose.runtime.mutableStateListOf
          import com.lagradost.cloudstream3.mapper
          import java.io.File

          /** Cartelle e dati persistenti in %APPDATA%\CloudStreamDesktop */
          object Storage {
              val root: File = File(System.getenv("APPDATA") ?: System.getProperty("user.home"), "CloudStreamDesktop")
                  .also { it.mkdirs() }
              val pluginsDir: File = File(root, "plugins").also { it.mkdirs() }
              private val favFile = File(root, "favorites.json")

              data class Fav(
                  val name: String = "",
                  val url: String = "",
                  val apiName: String = "",
                  val posterUrl: String? = null,
              )

              val favorites = mutableStateListOf<Fav>()

              fun load() {
                  runCatching {
                      if (favFile.exists()) {
                          favorites.clear()
                          favorites.addAll(mapper.readValue(favFile, Array<Fav>::class.java).toList())
                      }
                  }
              }

              private fun save() {
                  runCatching { favFile.writeText(mapper.writeValueAsString(favorites.toList())) }
              }

              fun isFavorite(url: String, apiName: String) = favorites.any { it.url == url && it.apiName == apiName }

              fun toggleFavorite(fav: Fav) {
                  val existing = favorites.firstOrNull { it.url == fav.url && it.apiName == fav.apiName }
                  if (existing != null) favorites.remove(existing) else favorites.add(fav)
                  save()
              }
          }
          CS_EOF_10
