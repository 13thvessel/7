          cat > work/src/desktopMain/kotlin/com/lagradost/desktop/Player.kt <<'CS_EOF_7'
          package com.lagradost.desktop

          import androidx.compose.foundation.layout.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.awt.SwingPanel
          import androidx.compose.ui.unit.dp
          import com.lagradost.cloudstream3.SubtitleFile
          import com.lagradost.cloudstream3.utils.ExtractorLink
          import kotlinx.coroutines.delay
          import uk.co.caprica.vlcj.player.component.EmbeddedMediaPlayerComponent
          import java.awt.Desktop
          import java.net.URI

          /** Player integrato basato su libVLC (vlcj). Richiede VLC 64 bit installato. */
          @Composable
          fun PlayerScreen(title: String, link: ExtractorLink, subs: List<SubtitleFile>, onBack: () -> Unit) {
              val component = remember { runCatching { EmbeddedMediaPlayerComponent() } }

              Column(Modifier.fillMaxSize()) {
                  Row(Modifier.fillMaxWidth().padding(8.dp), verticalAlignment = Alignment.CenterVertically) {
                      TextButton(onClick = onBack) { Text("← Indietro") }
                      Text("$title — ${link.name}", style = MaterialTheme.typography.titleMedium, maxLines = 1)
                  }

                  val c = component.getOrNull()
                  if (c == null) {
                      Column(Modifier.padding(24.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Text("Impossibile avviare libVLC. Installa VLC media player a 64 bit (videolan.org) e riprova.")
                          Text(link.url, style = MaterialTheme.typography.bodySmall)
                          Button(onClick = { runCatching { Desktop.getDesktop().browse(URI(link.url)) } }) {
                              Text("Apri link nel browser")
                          }
                      }
                      return@Column
                  }

                  val mp = c.mediaPlayer()
                  var paused by remember { mutableStateOf(false) }
                  var position by remember { mutableStateOf(0f) }
                  var volume by remember { mutableStateOf(100f) }
                  var subIndex by remember { mutableStateOf(-1) }

                  DisposableEffect(link.url) {
                      val opts = buildList {
                          if (link.referer.isNotBlank()) add(":http-referrer=${link.referer}")
                          (link.headers["User-Agent"] ?: link.headers["user-agent"])?.let { add(":http-user-agent=$it") }
                      }
                      mp.media().play(link.url, *opts.toTypedArray())
                      onDispose {
                          mp.controls().stop()
                          c.release()
                      }
                  }
                  LaunchedEffect(Unit) {
                      while (true) { position = mp.status().position(); delay(500) }
                  }

                  SwingPanel(factory = { c }, modifier = Modifier.weight(1f).fillMaxWidth())

                  Row(
                      Modifier.fillMaxWidth().padding(horizontal = 12.dp, vertical = 6.dp),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(12.dp),
                  ) {
                      Button(onClick = { mp.controls().pause(); paused = !paused }) { Text(if (paused) "▶" else "⏸") }
                      Slider(
                          value = position.coerceIn(0f, 1f),
                          onValueChange = { position = it; mp.controls().setPosition(it) },
                          modifier = Modifier.weight(1f),
                      )
                      Text("🔊")
                      Slider(
                          value = volume, valueRange = 0f..120f,
                          onValueChange = { volume = it; mp.audio().setVolume(it.toInt()) },
                          modifier = Modifier.width(120.dp),
                      )
                      if (subs.isNotEmpty()) {
                          var open by remember { mutableStateOf(false) }
                          Box {
                              OutlinedButton(onClick = { open = true }) { Text("Sottotitoli") }
                              DropdownMenu(open, { open = false }) {
                                  DropdownMenuItem(text = { Text("Nessuno") }, onClick = {
                                      mp.subpictures().setTrack(-1); subIndex = -1; open = false
                                  })
                                  subs.forEachIndexed { i, s ->
                                      DropdownMenuItem(text = { Text(s.lang) }, onClick = {
                                          mp.subpictures().setSubTitleUri(s.url); subIndex = i; open = false
                                      })
                                  }
                              }
                          }
                      }
                  }
              }
          }
