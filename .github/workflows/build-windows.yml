        working-directory: work
        shell: bash
        run: gradle createDistributable --no-daemon --stacktrace
      - name: Build installer (opzionale)
        working-directory: work
        continue-on-error: true
        shell: bash
        run: gradle packageExe --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CloudStream-Windows
          path: |
            work/build/compose/binaries/main/app/CloudStream/**
            work/build/compose/binaries/main/exe/*.exe
