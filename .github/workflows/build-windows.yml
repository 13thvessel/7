          cat > work/src/desktopMain/kotlin/com/lagradost/desktop/PluginManager.kt <<'CS_EOF_8'
          package com.lagradost.desktop

          import androidx.compose.runtime.mutableStateListOf
          import com.lagradost.cloudstream3.APIHolder
          import com.lagradost.cloudstream3.mapper
          import com.lagradost.cloudstream3.plugins.BasePlugin
          import java.io.File
          import java.net.URI
          import java.net.URLClassLoader
          import java.net.http.HttpClient
          import java.net.http.HttpRequest
          import java.net.http.HttpResponse
          import java.util.jar.JarFile

          /**
           * Le estensioni Android (.cs3) sono DEX e NON girano su desktop.
           * Su desktop un plugin è un normale .jar che contiene alla radice un `manifest.json`
           * ({"name": "...", "pluginClassName": "com.esempio.MioPlugin", "version": 1})
           * e una classe che estende [BasePlugin] e chiama registerMainAPI(...) in load().
           */
          object PluginManager {
              class Loaded(
                  val file: File,
                  val name: String,
                  val version: Int?,
                  val loader: URLClassLoader,
                  val instance: BasePlugin,
              )

              val loaded = mutableStateListOf<Loaded>()

              /** Carica tutti i .jar della cartella plugin. Ritorna la lista degli errori. */
              fun loadAll(): List<String> =
                  (Storage.pluginsDir.listFiles { f -> f.extension.equals("jar", true) } ?: emptyArray())
                      .mapNotNull { f -> load(f).exceptionOrNull()?.let { "${f.name}: ${it.message ?: it}" } }

              fun load(file: File): Result<Loaded> = runCatching {
                  if (loaded.any { it.file.absolutePath == file.absolutePath }) error("Già caricato")

                  val manifest = JarFile(file).use { jar ->
                      val entry = jar.getJarEntry("manifest.json") ?: error("manifest.json mancante nel jar")
                      jar.getInputStream(entry).use { mapper.readValue(it, BasePlugin.Manifest::class.java) }
                  }
                  val className = manifest.pluginClassName ?: error("pluginClassName mancante")

                  val loader = URLClassLoader(arrayOf(file.toURI().toURL()), PluginManager::class.java.classLoader)
                  val plugin = loader.loadClass(className).getDeclaredConstructor().newInstance() as BasePlugin
                  plugin.filename = file.absolutePath
                  plugin.load()
                  APIHolder.initAll()

                  Loaded(file, manifest.name ?: file.nameWithoutExtension, manifest.version, loader, plugin)
                      .also { loaded.add(it) }
              }

              fun unload(p: Loaded) {
                  runCatching { p.instance.beforeUnload() }
                  val mine = APIHolder.allProviders.filter { it.sourcePlugin == p.file.absolutePath }
                  mine.forEach {
                      APIHolder.allProviders.remove(it)
                      APIHolder.removePluginMapping(it)
                  }
                  runCatching { p.loader.close() }
                  loaded.remove(p)
              }

              /** Scarica un .jar da URL nella cartella plugin e lo carica. */
              fun installFromUrl(url: String): Result<Loaded> = runCatching {
                  val name = url.substringAfterLast('/').substringBefore('?').ifBlank { "plugin.jar" }
                      .let { if (it.endsWith(".jar", true)) it else "$it.jar" }
                  val target = File(Storage.pluginsDir, name)
                  val resp = HttpClient.newBuilder().followRedirects(HttpClient.Redirect.NORMAL).build()
                      .send(HttpRequest.newBuilder(URI.create(url)).build(), HttpResponse.BodyHandlers.ofByteArray())
                  if (resp.statusCode() !in 200..299) error("HTTP ${resp.statusCode()}")
                  target.writeBytes(resp.body())
                  load(target).getOrThrow()
              }

              fun installFromFile(src: File): Result<Loaded> = runCatching {
                  val target = File(Storage.pluginsDir, src.name)
                  src.copyTo(target, overwrite = true)
                  load(target).getOrThrow()
              }
          }
